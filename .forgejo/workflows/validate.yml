name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  terraform-fmt:
    name: Terraform format check
    runs-on: linux
    container:
      image: 100.86.4.29:3001/dax/ci-tools:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check formatting on changed .tf files
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.tf$' \
            | xargs -r dirname \
            | sort -u \
            || true)
          if [ -z "$CHANGED_DIRS" ]; then
            echo "No .tf files changed, skipping."
            exit 0
          fi
          echo "$CHANGED_DIRS" | while read -r dir; do
            echo "Checking $dir..."
            terraform fmt -check -recursive "$dir" || exit 1
          done

  checkov:
    name: Checkov IaC scan
    runs-on: linux
    container:
      image: 100.86.4.29:3001/dax/ci-tools:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed Terraform directories
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.tf$' \
            | xargs -r dirname \
            | sort -u \
            || true)
          if [ -z "$CHANGED_DIRS" ]; then
            echo "No .tf files changed, skipping."
            exit 0
          fi
          echo "$CHANGED_DIRS" | while read -r dir; do
            echo "Scanning $dir..."
            checkov -d "$dir" --framework terraform --quiet --compact \
              --skip-check CKV_TF_1 \
              || exit 1
          done

  secrets-scan:
    name: Scan for secrets
    runs-on: linux
    container:
      image: 100.86.4.29:3001/dax/ci-tools:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR commits for secrets
        run: |
          git fetch origin ${{ github.base_ref }}
          gitleaks detect --source . --config .gitleaks.toml \
            --log-opts "origin/${{ github.base_ref }}..HEAD"
          echo "No secrets detected in PR commits."

  scc:
    name: Code stats (informational)
    runs-on: linux
    continue-on-error: true
    container:
      image: 100.86.4.29:3001/dax/ci-tools:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count lines of code
        run: scc --no-complexity . | tee /tmp/scc_output.txt

      - name: Post stats comment
        env:
          GH_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          API_BASE: ${{ github.server_url }}/api/v1
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          MARKER = "<!-- scc-stats -->"

          with open("/tmp/scc_output.txt") as f:
              stats = f.read().strip()

          body = f"{MARKER}\n## Code stats\n\n```\n{stats}\n```"
          token = os.environ["GH_TOKEN"]
          api   = os.environ["API_BASE"]
          repo  = os.environ["REPO"]
          pr    = os.environ["PR_NUMBER"]
          hdrs  = {"Authorization": f"token {token}", "Content-Type": "application/json"}

          def req(method, url, data=None):
              r = urllib.request.Request(url, data=data, headers=hdrs, method=method)
              try:
                  return json.loads(urllib.request.urlopen(r).read())
              except urllib.error.HTTPError as e:
                  print(f"Warning: API call failed ({method} {url}): HTTP {e.code} {e.reason}")
                  return None

          comments = req("GET", f"{api}/repos/{repo}/issues/{pr}/comments")
          if comments is None:
              print("Could not fetch comments — skipping post.")
          else:
              existing = next((c for c in comments if MARKER in c["body"]), None)
              if existing:
                  req("PATCH", f"{api}/repos/{repo}/issues/comments/{existing['id']}",
                      json.dumps({"body": body}).encode())
                  print(f"Updated stats comment #{existing['id']}")
              else:
                  req("POST", f"{api}/repos/{repo}/issues/{pr}/comments",
                      json.dumps({"body": body}).encode())
                  print(f"Posted stats comment to PR #{pr}")
          PYEOF
